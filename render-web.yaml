# Deploy after the API exists, so its real HTTPS URL can be supplied below.
services:
  - type: web
    name: macrolens-web
    runtime: static
    buildCommand: cd apps/client && npm ci && npm run build:web
    staticPublishPath: apps/client/dist
    envVars:
      - key: NODE_VERSION
        value: 26.10.0
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
